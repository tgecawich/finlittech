name: CI

on:
  push:
  pull_request:

# A superseded run tells you nothing useful, and the free tier is finite.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs the suite and enforces the 100% branch threshold on lib/finance.
      # Deliberately not `npm test`: passing tests with an unexercised branch is
      # the failure mode this project cares about.
      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build
